<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430">
      <stop stop-color="#080B12"/>
      <stop offset="0.5" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#120D1B"/>
    </linearGradient>
    <linearGradient id="neon" x1="100" y1="0" x2="1050" y2="0">
      <stop stop-color="#F59E8B"/>
      <stop offset="0.5" stop-color="#C084FC"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <radialGradient id="purpleGlow"><stop stop-color="#C084FC" stop-opacity="0.30"/><stop offset="1" stop-color="#C084FC" stop-opacity="0"/></radialGradient>
    <radialGradient id="peachGlow"><stop stop-color="#F59E8B" stop-opacity="0.22"/><stop offset="1" stop-color="#F59E8B" stop-opacity="0"/></radialGradient>
    <radialGradient id="blueGlow"><stop stop-color="#60A5FA" stop-opacity="0.20"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" stroke="#FFFFFF" stroke-opacity="0.035"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="36"/></filter>
    <filter id="textGlow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="430" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="430" rx="30" fill="url(#grid)"/>

  <circle cx="1000" cy="80" r="230" fill="url(#purpleGlow)" filter="url(#blur)"><animate attributeName="opacity" values="0.45;0.9;0.45" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="170" cy="385" r="180" fill="url(#peachGlow)" filter="url(#blur)"><animate attributeName="opacity" values="0.4;0.8;0.4" dur="6s" repeatCount="indefinite"/></circle>
  <circle cx="650" cy="0" r="170" fill="url(#blueGlow)" filter="url(#blur)"/>

  <rect x="42" y="40" width="1116" height="350" rx="26" stroke="#FFFFFF" stroke-opacity="0.075"/>

  <text x="82" y="105" fill="#9CA3AF" font-family="JetBrains Mono,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="3">FOUNDER • AI ENGINEER • PRODUCT BUILDER</text>
  <text x="82" y="190" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="800" filter="url(#textGlow)">Subramanya Chary</text>
  <rect x="82" y="218" width="670" height="4" rx="2" fill="url(#neon)"><animate attributeName="width" values="180;670;180" dur="6s" repeatCount="indefinite"/></rect>
  <text x="82" y="271" fill="#E5E7EB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="650">I build systems, not demos.</text>
  <text x="82" y="311" fill="#8B949E" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">AI-native products • intelligent infrastructure • real-world systems</text>

  <g transform="translate(835 250)">
    <rect width="235" height="84" rx="18" fill="#FFFFFF" fill-opacity="0.045" stroke="#C084FC" stroke-opacity="0.28"/>
    <circle cx="25" cy="26" r="6" fill="#4ADE80"><animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <text x="42" y="31" fill="#9CA3AF" font-family="JetBrains Mono,monospace" font-size="12" font-weight="600" letter-spacing="1.4">CURRENTLY SHIPPING</text>
    <text x="24" y="61" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Bloom v3</text>
  </g>

  <g transform="translate(82 350)">
    <rect width="112" height="30" rx="15" fill="#F59E8B" fill-opacity="0.12"/><text x="18" y="20" fill="#F59E8B" font-family="JetBrains Mono,monospace" font-size="12">BUILDING</text>
    <rect x="126" width="95" height="30" rx="15" fill="#C084FC" fill-opacity="0.12"/><text x="147" y="20" fill="#C084FC" font-family="JetBrains Mono,monospace" font-size="12">R&amp;D</text>
    <rect x="235" width="125" height="30" rx="15" fill="#60A5FA" fill-opacity="0.12"/><text x="255" y="20" fill="#60A5FA" font-family="JetBrains Mono,monospace" font-size="12">SHIPPING</text>
  </g>
</svg>